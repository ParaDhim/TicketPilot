version: '3.8'

services:
  app:
    build: .
    environment:
      - DB_URL=postgres://user:pass@db:5432/ticketpilot?sslmode=disable
      - OLLAMA_URL=http://host.docker.internal:11434
    depends_on:
      - db
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=ticketpilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./internal/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  postgres_data:
